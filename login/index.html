<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Kigo Xpress - Login</title>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f7f7f7;display:flex;align-items:center;justify-content:center;font-family:system-ui}
.card{width:100%;max-width:380px;background:#fff;border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.15);padding:30px 26px;text-align:center}
.logo{font-size:52px;font-family:'Segoe Script',cursive;line-height:1;margin:10px 0}
.logo b{color:#111}
.logo span{color:#e11d2a}
.sub{letter-spacing:3px;font-size:12px;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:30px}
.sub:before,.sub:after{content:'';width:24px;height:2px;background:#e11d2a}
.input{background:#f2f3f7;border-radius:20px;padding:14px 18px;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.input input{border:none;outline:none;background:transparent;flex:1;font-size:15px}
.input .icono{width:20px;height:20px;flex-shrink:0;color:#6b7280;display:flex;align-items:center;justify-content:center}
.input .icono svg{width:20px;height:20px}
.line{width:1px;height:20px;background:#d1d5db}
.clear-btn{display:none;border:none;background:transparent;cursor:pointer;width:22px;height:22px;align-items:center;justify-content:center;color:#9ca3af;opacity:.55;padding:0;flex-shrink:0}
.clear-btn.visible{display:flex}
.clear-btn svg{width:18px;height:18px}
.ojo{cursor:pointer;width:22px;height:22px;display:flex;align-items:center;justify-content:center;color:#6b7280;flex-shrink:0}
.ojo svg{width:20px;height:20px}
.btn{width:92%;background:#e11d2a;color:#fff;border:none;border-radius:999px;padding:13px;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;box-shadow:0 10px 20px rgba(225,29,42,.3);margin:0 auto}
.btn svg{width:20px;height:20px}
.btn-line{width:1px;height:20px;background:rgba(255,255,255,.6)}
.msg{color:#dc2626;font-size:13px;margin-top:12px;display:none}
</style>
</head>
<body>
<div class="card">
<div class="logo"><b>Kigo <span>X</span>press</b></div>
<div class="sub">LA SOLUCIÓN A TU ALCANCE</div>

<div class="input">
<span class="icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5"/></svg></span>
<div class="line"></div>
<input id="usuario" placeholder="Usuario" autocomplete="off">
<button type="button" class="clear-btn" id="clearUsuario" aria-label="Borrar usuario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
</div>

<div class="input">
<span class="icono"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/><circle cx="12" cy="16" r="1" fill="currentColor"/></svg></span>
<div class="line"></div>
<input id="password" type="password" placeholder="Contraseña">
<button type="button" class="clear-btn" id="clearPassword" aria-label="Borrar contraseña"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
<span class="ojo" onclick="document.getElementById('password').type=document.getElementById('password').type=='password'?'text':'password'"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></span>
</div>

<button class="btn" onclick="ingresar()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><path d="M10 17l5-5-5-5"/><path d="M15 12H3"/></svg><div class="btn-line"></div> Ingresar</button>
<div id="msg" class="msg"></div>
</div>
<script>
const firebaseConfig = { apiKey: "AIzaSyAsRa2QW9-l3vuh_mWa0ZhJh6ZSPNRRIkM", authDomain: "registro-ventas-kigo.firebaseapp.com", databaseURL: "https://registro-ventas-kigo-default-rtdb.firebaseio.com", projectId: "registro-ventas-kigo", storageBucket: "registro-ventas-kigo.firebasestorage.app", messagingSenderId: "494693818399", appId: "1:494693818399:web:34312307ec5cd52190752a" };
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

// SOLO CREAMOS ADMIN, NO REPARTIDOR
db.ref('usuarios').once('value').then(s=>{
 if(!s.exists()){
  db.ref('usuarios').set({
   admin:{usuario:'admin',password:'1234',rol:'admin',nombre:'Administrador'}
  });
 }
});

function showMsg(t){document.getElementById('msg').innerText=t;document.getElementById('msg').style.display='block';}

// X TRANSPARENTE PARA BORRAR - USUARIO Y CONTRASEÑA
function setupClear(inputId, btnId){
 var input=document.getElementById(inputId);
 var btn=document.getElementById(btnId);
 function toggle(){ btn.classList.toggle('visible', input.value.length>0); }
 input.addEventListener('input', toggle);
 btn.addEventListener('click', function(){ input.value=''; toggle(); input.focus(); });
 toggle();
}
setupClear('usuario','clearUsuario');
setupClear('password','clearPassword');

function ingresar(){
 var u=document.getElementById('usuario').value.trim();
 var p=document.getElementById('password').value.trim();
 if(!u||!p){showMsg('Ingresa usuario y contraseña');return;}

 // 1. ADMIN - SOLO USUARIOS
 db.ref('usuarios').once('value').then(s=>{
  var users=s.val()||{};
  var adminFound=Object.values(users).find(x=>x.rol==='admin' && x.usuario.toLowerCase()===u.toLowerCase() && x.password===p);
  if(adminFound){
   localStorage.setItem('kigo_rol','admin');
   localStorage.setItem('kigo_user',adminFound.usuario);
   localStorage.setItem('kigo_nombre',adminFound.nombre);
   location.href='admin.html';
   return;
  }
  // Si puso admin 1234 manual también entra
  if(u.toLowerCase()==='admin' && p==='1234'){
   localStorage.setItem('kigo_rol','admin');localStorage.setItem('kigo_user','admin');location.href='admin.html';return;
  }

  // 2. REPARTIDORES - BUSCA POR USUARIO Y CONTRASEÑA DENTRO DE /repartidores
  db.ref('repartidores').once('value').then(s2=>{
   var reps=s2.val()||{};
   var foundKey=null;
   var foundRep=null;
   Object.keys(reps).forEach(key=>{
     var r=reps[key];
     var usuarioRep=(r.usuario||r.user||'').toString().toLowerCase();
     var passRep=(r.contraseña||r.password||r.pass||'').toString();
     if(usuarioRep===u.toLowerCase() && passRep===p){
       foundKey=key;
       foundRep=r;
     }
   });

   if(foundRep){
     localStorage.setItem('kigo_rol','repartidor');
     localStorage.setItem('kigo_repa_key',foundKey);
     localStorage.setItem('kigo_repa_nombre',foundRep.nombre);
     localStorage.setItem('kigo_repa_usuario',foundRep.usuario);
     localStorage.setItem('kigo_user',foundRep.usuario);
     localStorage.setItem('kigo_nombre',foundRep.nombre);
     location.href='panelrepa.html';
     return;
   }

   showMsg('Usuario o contraseña incorrectos');
  });
 });
}
</script>
</body>
</html>
